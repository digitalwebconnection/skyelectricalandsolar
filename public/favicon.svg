<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(251, 191, 36, 0.25)" stroke-width="1.5" />

  <!-- Solar Rays / Sunburst Ring -->
  <g stroke="url(#solarGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="8" x2="32" y2="13" />
    <line x1="32" y1="51" x2="32" y2="56" />
    <line x1="8" y1="32" x2="13" y2="32" />
    <line x1="51" y1="32" x2="56" y2="32" />
    <line x1="15" y1="15" x2="19" y2="19" />
    <line x1="45" y1="45" x2="49" y2="49" />
    <line x1="15" y1="49" x2="19" y2="45" />
    <line x1="45" y1="19" x2="49" y2="15" />
  </g>

  <!-- Electrical Energy Bolt -->
  <path d="M35 15L20 33H33L29 49L44 31H31L35 15Z" fill="url(#solarGrad)" filter="url(#glow)" />
</svg>
